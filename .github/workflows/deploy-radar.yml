name: Deploy Radar (one-shot)
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deploy:
    if: "!contains(github.event.head_commit.message, 'full deploy')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch and unpack the Radar package
        run: |
          curl -fsSL -o /tmp/radar_deploy.zip "https://muse.ai/files/1441831205676483/2473411006399623/kku2e6pgdg8r2wphbie5965k/radar_deploy.zip"
          unzip -o -q /tmp/radar_deploy.zip -d .
          rm -f .radar-init
          rm -f .github/workflows/deploy-radar.yml
      - name: Commit everything
        run: |
          git config user.name "radar-deploy"
          git config user.email "radar-deploy@users.noreply.github.com"
          git add -A -- ':!.github/workflows/aggregate.yml'
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "Radar: full deploy"
          git push
